<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style type="text/css">

    /* this is an id */
    #headline{color: blue;text-align: center;}
    
    /* this is a class */
    .summary{font-style: italic;}

    .style1{color: red;}

    .style2{font-style: italic;}

    .style3{font-weight: bold;}

    </style>
</head>
<body>
    <!-- this is a header using the id headline -->
    <h2 id="headline">This is the Heading using ID!</h2>
    <!-- this is the class summary -->
    <p class="summary"> This is the part of the Summary. The text is italics. </p>

    This is the normal text with no styling.

    <p class="style1 style2 style3">this is a paragraph with multiple styles</p>

<!-- id's should be used for one part of code but classes are general and can be used for multiple lines of code -->


</body>
</html>
