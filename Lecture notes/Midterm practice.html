<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title -->
    <title>Title of the page</title>

    <style>
        /* this is an ID */
        #headline{color: aqua;}
        /* this is a class */
        .style1{color: aquamarine;}
    </style>
    
</head>
<body>
    <!-- headers -->
    <h1>Biggest</h1>
    <h2>Larger</h2>
    <h3>large</h3>
    <h4>medium</h4>
    <h5>small</h5>
    <h6>smallest</h6>
     <!-- ordered list -->
      <ol>
            <li>list item</li>
            <li>list item</li>
      </ol>
      <!-- unordered list -->
      <ul>
            <li>list item</li>
            <li>list item</li>
      </ul>
      <!-- normal paragraphs -->
       <p>paragraph</p>
       <!-- bold -->
       <strong>bold</strong>
       <!-- italics -->
        <em>italics</em>
        <!-- links -->
        <a href="https://www.viu.ca/"target="_blank">external link</a>
        <!-- tables -->
        <table border="1">
            <tr>
                <th>table header</th>
                <td>hello</td>
                <!-- colspan merges collumns together -->
                <td colspan="2">test</td>
                
            </tr>
            <tr>
                <!-- rowspan merges rows together -->
                <td rowspan="2">test</td>
                <td>test</td>
            </tr>
        </table>
        <!-- images -->
        <img src="lecture 3 Images/viu-logo.jpg" alt="Large logo"height="100"width="100">
        <!-- classes and ids -->
        <h2 id="headline">This is the Heading using ID!</h2>
        <h2 class="style1">this is a heading using class!</h2>
</body>
</html>
