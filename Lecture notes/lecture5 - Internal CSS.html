<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- internal style sheet -->
    <style type="text/css">
        h2{
            color:green;

            font-style: italic;

            font-weight: bold;

            font-family: Arial, Helvetica, sans-serif;

            text-align: center;

            /* you can just use underline like normal but you can add an atribute like dotted to make the underline dotted */
            text-decoration: underline dotted;
        }
        
        /* colours list items pink */
        li{
            color: pink;

        }
    </style>
<body>

    <h2> Go ahead!</h2>
    <h2>Move forward with a project</h2>

    <ul>
        <!-- inline to overide the first two colours -->
        <li style="color: red;">item 1</li> 
        <li style="color: blue;">item 2</li>
        <li>item 3</li>
        <li>item 4</li>
        <li>item 5</li>
        <li>item 6</li>
    </ul>

</body>
</html>
