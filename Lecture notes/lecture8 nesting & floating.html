<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {width: 100%; height: 100px; border: 1px solid orange;}

        .nav {width: 125px; height: 250px; border: 1px solid green; float: left;}

        .sidebar {width: 125px; height: 250px; border: 1px solid blue; float: right;}

        .main {height: 350px;}

        .footer {width: 100%; height: 50px; border: 1px solid red;}

        .clearfloat{clear: both;}
    </style>
</head>
<body>
    <div class="header">Header</div>

    <div class="nav">Nav Menu</div>

    <div class="sidebar">Sidebar</div>

    <div class="main"><h1>Main Content</h1></div>

    <div class="clearfloat"></div>

    <div class="footer">Footer</div>
</body>
</html>
